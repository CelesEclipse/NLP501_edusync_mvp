<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>EduSync demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f3f3f3;--acc:#2563eb;--mut:#777;--hl:#fde68a}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#262626;--acc:#60a5fa;--mut:#999;--hl:#854d0e}}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 20px;font-weight:600}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 20px 20px}
@media(max-width:800px){main{grid-template-columns:1fr}}
video{width:100%;background:#000;border-radius:8px}
#cur{background:var(--card);border-radius:8px;padding:10px;min-height:200px}
#cur img{width:100%;border-radius:4px}#cur pre{display:none;white-space:pre-wrap;font:inherit}
#list{max-height:260px;overflow-y:auto;margin-top:10px;display:grid;gap:4px}
button{text-align:left;border:0;border-radius:6px;padding:6px 10px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
button.on{background:var(--acc);color:#fff}button:disabled{opacity:.4;cursor:default}
small,.mut{color:var(--mut)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
#reads a{color:var(--acc);text-decoration:none}#reads a:hover{text-decoration:underline}
#reads div{margin:0 0 8px}.tag{font-size:11px;border-radius:4px;padding:1px 5px;background:var(--card);margin-right:4px}
.tag.cited{background:var(--acc);color:#fff}
input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;border:1px solid var(--card);background:var(--bg);color:var(--fg);font:inherit}
#hits{max-height:260px;overflow-y:auto;display:grid;gap:4px;margin-top:6px}#hits button{display:block;width:100%}
mark{background:var(--hl);color:inherit}
</style></head><body>
<header>EduSync: click a slide to jump the video, play the video to follow the slides</header>
<main>
 <div>
  <video id="v" src="lecture.mp4" controls></video><p><small id="info"></small></p>
  <h3>Search the lecture</h3>
  <input id="q" type="search" placeholder="e.g. masked language model, distillation, SQuAD">
  <div id="hits"></div>
 </div>
 <div>
  <div id="cur"><small>Press play or pick a slide.</small></div>
  <h3>Readings for this slide</h3><div id="reads" class="mut">-</div>
  <h3>Slides</h3><div id="list"></div>
 </div>
</main>
<script>
const $=id=>document.getElementById(id),v=$('v'),cur=$('cur'),list=$('list');
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let segs=[],texts={},links={},transcript=[],btns={},active=-1;
function show(k){
  if(k===active)return; active=k;
  cur.innerHTML=`<img src="slides/slide_${String(k).padStart(2,'0')}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><pre>${esc(texts[k]||'Slide '+k)}</pre>`;
  const L=links[k]||[];
  $('reads').innerHTML=L.length?L.map(m=>`<div><span class="tag ${m.why}">${m.why}</span><span class="tag">${esc(m.kind)}</span>`+
    `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>${m.page?` <small>(p. ${m.page})</small>`:''}`+
    `<br><small>${esc(m.authors||'')}${m.year?', '+m.year:''}</small></div>`).join(''):'No linked materials.';
  Object.values(btns).forEach(b=>b.classList.remove('on'));
  if(btns[k]){btns[k].classList.add('on');btns[k].scrollIntoView({block:'nearest'})}
}
function seek(t){v.currentTime=t;v.play()}
function search(q){
  // crude stemming so "masked" also finds "mask", "masking"
  const terms=q.toLowerCase().split(/\W+/).filter(w=>w.length>1).map(w=>w.length>4?w.replace(/(ing|ed|es|s)$/,''):w);
  if(!terms.length){$('hits').innerHTML='';return}
  const re=new RegExp('\\b('+terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\w*','gi');
  const hits=transcript.map((s,i)=>{  // score = distinct query terms found in this segment and its neighbours
    const ctx=transcript.slice(Math.max(0,i-1),i+2).map(x=>x.text).join(' ').toLowerCase();
    return {s,score:terms.filter(w=>ctx.includes(w)).length+terms.filter(w=>s.text.toLowerCase().includes(w)).length};
  }).filter(h=>h.score>0).sort((a,b)=>b.score-a.score||a.s.start-b.s.start).slice(0,30);
  $('hits').innerHTML=hits.length?'':'<small>No matches in the transcript.</small>';
  hits.forEach(({s})=>{
    const b=document.createElement('button'),seg=segs.find(x=>s.start>=x.start&&s.start<x.end);
    b.innerHTML=`<b>${fmt(s.start)}</b>${seg?` <small>slide ${seg.slide}</small>`:''}<br>${esc(s.text).replace(re,'<mark>$&</mark>')}`;
    b.onclick=()=>seek(s.start);$('hits').appendChild(b);
  });
}
async function load(f){try{return await (await fetch(f)).json()}catch(e){return null}}
async function init(){
  segs=await load('alignment.json');
  (await load('slides.json')||[]).forEach(s=>texts[s.slide]=s.text);
  links=await load('links.json')||{};
  transcript=await load('transcript.json')||[];
  if(!transcript.length){$('q').disabled=true;$('q').placeholder='Search needs transcript.json (see prepare.py)'}
  const n=Math.max(Object.keys(texts).length,...segs.map(s=>s.slide));
  for(let k=1;k<=n;k++){
    const s=segs.find(x=>x.slide===k),b=document.createElement('button');
    b.textContent=s?`Slide ${k}  (${fmt(s.start)})`:`Slide ${k}  (not aligned)`;
    b.disabled=!s;
    if(s)b.onclick=()=>{seek(s.start);show(k)};
    btns[k]=b;list.appendChild(b);
  }
  $('info').textContent=new Set(segs.map(s=>s.slide)).size+' of '+n+' slides aligned';
}
v.ontimeupdate=()=>{const t=v.currentTime,s=segs.find(x=>t>=x.start&&t<x.end);if(s)show(s.slide)};
let timer;$('q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),150)};
init();
</script></body></html>
